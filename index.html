<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Cycle — Period Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* ============ TOKENS ============ */
  :root{
    --ink:      #422427;
    --white:    #ffffff;

    --ink-06:   rgba(66, 36, 39, .06);
    --ink-08:   rgba(66, 36, 39, .08);
    --ink-12:   rgba(66, 36, 39, .12);
    --ink-25:   rgba(66, 36, 39, .25);
    --ink-45:   rgba(66, 36, 39, .45);
    --ink-60:   rgba(66, 36, 39, .60);

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;
    --s-7: 48px;

    --r-md:   22px;
    --r-lg:   34px;
    --r-full: 999px;
  }

  *, *::before, *::after{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; color-scheme: light; }

  body{
    margin: 0;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    background: var(--white);
    color: var(--ink);
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }

  button, input{ font: inherit; color: inherit; }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  .blob{
    position: fixed;
    border-radius: 50%;
    background: var(--ink);
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
  }
  .b1{ width: 380px; height: 380px; top: -90px;  right: -110px; opacity: .20; }
  .b2{ width: 420px; height: 420px; bottom: -140px; left: -150px; opacity: .12; }

  main{ position: relative; z-index: 1; }

  /* ============ SCREENS ============ */
  .screen{
    display: none;
    flex-direction: column;
    min-height: 100dvh;
    padding:
      calc(var(--s-5) + env(safe-area-inset-top))
      var(--s-5)
      calc(var(--s-5) + env(safe-area-inset-bottom));
  }
  .screen.active{
    display: flex;
    animation: screenIn .38s cubic-bezier(.2, .7, .3, 1) both;
  }
  @keyframes screenIn{
    from{ opacity: 0; transform: translateY(10px); }
    to  { opacity: 1; transform: none; }
  }

  #screenHome, #screenForecast{
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
  }

  .wrap{
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    gap: var(--s-5);
  }

  .stack{
    display: flex;
    flex-direction: column;
    gap: var(--s-3);
  }

  /* ============ ONBOARDING ============ */
  #screenOnboard .wrap{
    justify-content: center;
    justify-content: safe center;
    gap: var(--s-6);
  }

  .avatar-block{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s-3);
    width: 100%;
  }

  .avatar-picker{
    position: relative;
    display: grid;
    place-items: center;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background-color: var(--ink-08);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    overflow: hidden;
    transition: transform .25s ease, background-color .25s ease;
  }
  .avatar-picker:active{ transform: scale(.96); }
  .avatar-picker .plus{
    font-size: 34px;
    font-weight: 300;
    line-height: 1;
    color: var(--ink);
    opacity: .4;
  }
  .avatar-picker.has-photo .plus{ display: none; }

  .field{
    width: 100%;
    border: 0;
    outline: 0;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    background: var(--ink-08);
    border-radius: var(--r-md);
    padding: var(--s-4) var(--s-5);
    min-height: 56px;
    transition: background-color .2s ease;
  }
  .field::placeholder{ color: var(--ink-45); font-weight: 400; }
  .field:focus{ background: var(--ink-12); }

  #nameInput{
    max-width: 320px;
    text-align: center;
  }

  input[type="date"].field{
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="date"]::-webkit-calendar-picker-indicator{
    opacity: .45;
    cursor: pointer;
    margin-left: var(--s-1);
  }
  input[type="date"]:invalid::-webkit-datetime-edit{ color: var(--ink-45); }

  .onboard-bottom{
    display: flex;
    flex-direction: column;
    gap: var(--s-5);
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
  }

  .form-group{
    display: flex;
    flex-direction: column;
    gap: var(--s-2);
  }

  .question{
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.3;
  }

  .hint{
    margin: 0;
    padding: 0 var(--s-1);
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-45);
  }

  .btn{
    border: 0;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--white);
    background: var(--ink);
    border-radius: var(--r-md);
    padding: var(--s-4) var(--s-5);
    min-height: 56px;
    cursor: pointer;
    transition: opacity .2s ease, transform .2s ease, background-color .2s ease;
  }
  .btn:disabled{ opacity: .3; cursor: default; }
  .btn:not(:disabled):active{ transform: scale(.985); }
  .btn.ghost{ background: var(--ink-08); color: var(--ink); }

  /* ============ LOCK ============ */
  #screenLock .wrap{
    justify-content: center;
    justify-content: safe center;
    gap: var(--s-6);
  }

  .lock-head{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s-3);
    text-align: center;
  }

  .avatar-lg{ width: 96px !important; height: 96px !important; }
  .avatar-lg svg{ width: 44px !important; height: 44px !important; }

  .lock-sub{
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-60);
  }

  .lock-form{
    display: flex;
    flex-direction: column;
    gap: var(--s-3);
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
  }

  .lock-error{
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: var(--ink-08);
    padding: var(--s-2) var(--s-3);
    border-radius: var(--r-md);
  }
  .lock-error[hidden]{ display: none; }

  .lock-reset{
    align-self: center;
    border: 0;
    background: transparent;
    color: var(--ink-45);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: var(--s-2);
  }

  /* ============ PROFILE ============ */
  .profile{
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding-top: var(--s-2);
  }

  .avatar{
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--ink-08) center / cover no-repeat;
    color: var(--ink);
    overflow: hidden;
  }
  .avatar svg{ width: 26px; height: 26px; opacity: .35; }

  .user-name{
    margin: 0;
    font-family: 'Chewy', cursive;
    font-weight: 400;
    font-size: clamp(26px, 7.5vw, 34px);
    line-height: 1.05;
    letter-spacing: .4px;
    word-break: break-word;
  }

  /* ============ PANELS ============ */
  .panel{
    border-radius: var(--r-lg);
    padding: var(--s-4);
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    box-shadow: 0 24px 60px -28px var(--ink-25);
  }

  /* ============ CALENDAR ============ */
  .cal-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 var(--s-3);
  }
  .month-label{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .nav{
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: var(--ink-08);
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background-color .2s ease, transform .2s ease;
  }
  .nav:active{ transform: scale(.92); background: var(--ink-12); }

  .weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding-bottom: var(--s-2);
  }
  .weekdays span{
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-45);
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    will-change: transform, opacity;
  }
  .grid.slide-next{ animation: slideNext .3s cubic-bezier(.2,.7,.3,1); }
  .grid.slide-prev{ animation: slidePrev .3s cubic-bezier(.2,.7,.3,1); }
  @keyframes slideNext{
    from{ opacity: 0; transform: translateX(24px); }
    to  { opacity: 1; transform: none; }
  }
  @keyframes slidePrev{
    from{ opacity: 0; transform: translateX(-24px); }
    to  { opacity: 1; transform: none; }
  }

  .cell{
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 1 / 1;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink);
  }
  .cell .num{ position: relative; z-index: 2; transition: opacity .15s ease; }

  .cell::before{
    content: '';
    position: absolute;
    z-index: 1;
    top: 4px; bottom: 4px; left: 0; right: 0;
    background: transparent;
  }

  .cell[data-state="actual"]{ color: var(--white); }
  .cell[data-state="actual"]::before{ background: var(--ink); }

  .cell[data-state="predicted"]{ color: var(--ink); }
  .cell[data-state="predicted"]::before{ background: var(--ink-12); }

  .cell.seg-start::before{
    left: 3px;
    border-top-left-radius: var(--r-full);
    border-bottom-left-radius: var(--r-full);
  }
  .cell.seg-end::before{
    right: 3px;
    border-top-right-radius: var(--r-full);
    border-bottom-right-radius: var(--r-full);
  }
  .cell.seg-start.seg-end::before{ border-radius: var(--r-full); }

  .cell.today .num::after{
    content: '';
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 3px; height: 3px;
    margin-left: -1.5px;
    border-radius: 50%;
    background: currentColor;
    opacity: .7;
  }

  .cell.is-tappable{ cursor: pointer; }
  .cell.is-tappable:active .num{ opacity: .55; }
  .cell:focus-visible{
    outline: 0;
    border-radius: var(--r-full);
    box-shadow: inset 0 0 0 2px var(--ink-25);
  }

  /* ============ CAPTION / LEGEND ============ */
  .caption-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--s-3);
    flex-wrap: wrap;
    padding: 0 var(--s-2);
  }
  .caption{
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-60);
    text-align: center;
  }

  .text-btn{
    border: 0;
    background: var(--ink-08);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: var(--s-2) var(--s-3);
    border-radius: var(--r-full);
    cursor: pointer;
    transition: background-color .2s ease;
  }
  .text-btn:active{ background: var(--ink-12); }

  .legend-row{
    display: flex;
    justify-content: center;
    gap: var(--s-4);
  }
  .legend{
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-60);
  }
  .dot{
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .dot.solid{ background: var(--ink); }
  .dot.light{ background: var(--ink-12); }

  /* ============ FORECAST ============ */
  .cycle-panel{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-4);
  }
  .cycle-label{
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-60);
  }
  .stepper{
    display: flex;
    align-items: center;
    gap: var(--s-2);
  }
  .step-btn{
    display: grid;
    place-items: center;
    width: 34px; height: 34px;
    border: 0;
    border-radius: 50%;
    background: var(--ink-08);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: background-color .2s ease, transform .2s ease;
  }
  .step-btn:active{ transform: scale(.92); background: var(--ink-12); }
  .step-value{
    min-width: 76px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }

  .forecast-panel{
    display: flex;
    flex-direction: column;
    gap: var(--s-1);
  }
  .forecast-head{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-45);
    padding: 0 var(--s-2) var(--s-1);
  }
  .forecast-list{
    display: flex;
    flex-direction: column;
    gap: var(--s-1);
  }
  .forecast-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-3);
    width: 100%;
    border: 0;
    background: transparent;
    padding: var(--s-3) var(--s-2);
    border-radius: var(--r-md);
    text-align: left;
    cursor: pointer;
    transition: background-color .2s ease;
  }
  .forecast-row:active{ background: var(--ink-06); }
  .forecast-main{
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .forecast-month{ font-size: 14px; font-weight: 600; }
  .forecast-range{ font-size: 13px; color: var(--ink-60); }
  .forecast-badge{
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--ink-08);
    padding: var(--s-1) var(--s-2);
    border-radius: var(--r-full);
    white-space: nowrap;
  }

  /* ============ DAY SCREEN ============ */
  .day-top{
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding-top: var(--s-2);
  }
  .back-btn{
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border: 0;
    border-radius: 50%;
    background: var(--ink-08);
    color: var(--ink);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: background-color .2s ease, transform .2s ease;
  }
  .back-btn:active{ transform: scale(.92); background: var(--ink-12); }

  .day-meta{
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .day-date{ font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .day-phase{ font-size: 13px; font-weight: 500; color: var(--ink-60); }

  .gif-wrap{ position: relative; width: 100%; }

  .gif-card{
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    padding: 0;
    border: 0;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--ink);
    cursor: pointer;
    isolation: isolate;
    transition: transform .25s ease;
  }
  .gif-card:active{ transform: scale(.988); }

  .gif-img{
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .gif-img[hidden]{ display: none; }

  .gif-fallback{ position: absolute; inset: 0; background: var(--ink); }
  .gif-fallback[hidden]{ display: none; }

  .gif-blob{
    position: absolute;
    border-radius: 50%;
    background: var(--white);
    filter: blur(26px);
    will-change: transform;
  }
  .g1{ width: 62%; aspect-ratio: 1; left: -12%; top: -22%; opacity: .50; animation: floatA 9s ease-in-out infinite; }
  .g2{ width: 48%; aspect-ratio: 1; right: -10%; bottom: -20%; opacity: .30; animation: floatB 11s ease-in-out infinite; }
  .g3{ width: 30%; aspect-ratio: 1; left: 42%; top: 44%; opacity: .22; animation: floatC 7s ease-in-out infinite; }

  @keyframes floatA{
    0%, 100%{ transform: translate3d(0, 0, 0) scale(1); }
    50%     { transform: translate3d(14%, 10%, 0) scale(1.14); }
  }
  @keyframes floatB{
    0%, 100%{ transform: translate3d(0, 0, 0) scale(1); }
    50%     { transform: translate3d(-12%, -14%, 0) scale(1.10); }
  }
  @keyframes floatC{
    0%, 100%{ transform: translate3d(0, 0, 0) scale(1); opacity: .18; }
    50%     { transform: translate3d(-16%, 12%, 0) scale(1.22); opacity: .30; }
  }

  .gif-hint{
    position: absolute;
    right: var(--s-3);
    bottom: var(--s-3);
    z-index: 3;
    background: rgba(255, 255, 255, .92);
    color: var(--ink);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    padding: var(--s-1) var(--s-3);
    border-radius: var(--r-full);
    pointer-events: none;
  }

  .gif-remove{
    position: absolute;
    top: var(--s-3);
    right: var(--s-3);
    z-index: 4;
    display: grid;
    place-items: center;
    width: 30px; height: 30px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .92);
    color: var(--ink);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: transform .2s ease;
  }
  .gif-remove:active{ transform: scale(.9); }
  .gif-remove[hidden]{ display: none; }

  .advice-panel{
    display: flex;
    flex-direction: column;
    gap: var(--s-3);
  }
  .advice-text{
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ink);
  }
  .advice-meta{ font-size: 12px; font-weight: 500; color: var(--ink-45); }

  /* ============ VOICE DIARY ============ */
  .voice-panel{
    display: flex;
    flex-direction: column;
    gap: var(--s-3);
  }

  .voice-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-3);
  }

  .voice-title{
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .voice-rec-btn{
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
    border: 0;
    background: var(--ink);
    color: var(--white);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: var(--s-2) var(--s-4);
    border-radius: var(--r-full);
    cursor: pointer;
    transition: transform .2s ease;
  }
  .voice-rec-btn:active{ transform: scale(.96); }
  .voice-rec-btn[hidden]{ display: none; }

  .voice-rec-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--white);
  }

  .voice-active{
    display: flex;
    align-items: center;
    gap: var(--s-3);
    padding: var(--s-3) var(--s-4);
    background: var(--ink-08);
    border-radius: var(--r-md);
  }
  .voice-active[hidden]{ display: none; }

  .voice-pulse{
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--ink);
    animation: voicePulse 1.2s ease-in-out infinite;
  }
  @keyframes voicePulse{
    0%, 100%{ opacity: 1; transform: scale(1); }
    50%     { opacity: .35; transform: scale(.85); }
  }

  .voice-timer{
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .voice-stop{
    border: 0;
    background: var(--ink);
    color: var(--white);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: var(--s-2) var(--s-4);
    border-radius: var(--r-full);
    cursor: pointer;
    transition: transform .2s ease;
  }
  .voice-stop:active{ transform: scale(.96); }

  .voice-list{
    display: flex;
    flex-direction: column;
    gap: var(--s-2);
  }

  .voice-empty{
    margin: 0;
    padding: var(--s-2);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-45);
    text-align: center;
  }

  .voice-row{
    display: flex;
    align-items: center;
